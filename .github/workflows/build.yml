name: Build Mobile Apps

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome dell''App'
        required: true
        default: 'WebToApp'
      app_id:
        description: 'Package ID (es. com.example.app)'
        required: true
        default: 'com.webtoapp.starter'
      web_url:
        description: 'URL del sito da convertire'
        required: true
        default: 'https://google.com'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Dependencies
        run: |
          npm install
          npm install -D webpack-cli
        
      - name: Build Web Project
        run: npm run build
          
      - name: Initialize Capacitor
        run: |
          mkdir -p www
          # Create a dummy index.html just to satisfy cap init (it won't be used for navigation)
          echo 'Loading...' > www/index.html
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.app_id }}" --web-dir www
          
      - name: Configure Native App (Real App Mode)
        run: |
          # Verify capacitor.config.json exists (generated by npx cap init)
          ls -l capacitor.config.json || echo "capacitor.config.json NOT FOUND"
          
          node -e "
            const fs = require('fs');
            // Check if file exists before requiring
            if (!fs.existsSync('./capacitor.config.json')) {
              // Fallback: Create it manually if cap init failed to create it
              const config = {
                appId: '${{ github.event.inputs.app_id }}',
                appName: '${{ github.event.inputs.app_name }}',
                webDir: 'www',
                bundledWebRuntime: false
              };
              fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
            }
            
            const config = require('./capacitor.config.json');
            
            // Transform into a Real Native App Wrapper
            config.server = {
              url: '${{ github.event.inputs.web_url }}',
              cleartext: true,
              androidScheme: 'https',
              allowNavigation: ['*']
            };
            
            // Add Native Polish
            config.plugins = {
              SplashScreen: {
                launchShowDuration: 2000,
                backgroundColor: '#000000',
                showSpinner: true,
                spinnerColor: '#ffffff'
              }
            };
            
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
            console.log('Successfully upgraded capacitor.config.json to Native Mode');
          "
          
      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Dependencies
        run: |
          npm install
          npm install -D webpack-cli
        
      - name: Build Web Project
        run: npm run build
          
      - name: Initialize Capacitor
        run: |
          mkdir -p www
          echo 'Loading...' > www/index.html
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.app_id }}" --web-dir www
          
      - name: Configure Native App (Real App Mode)
        run: |
          # Verify capacitor.config.json exists
          ls -l capacitor.config.json || echo "capacitor.config.json NOT FOUND"

          node -e "
            const fs = require('fs');
            // Check if file exists before requiring
            if (!fs.existsSync('./capacitor.config.json')) {
              // Fallback: Create it manually if cap init failed to create it
              const config = {
                appId: '${{ github.event.inputs.app_id }}',
                appName: '${{ github.event.inputs.app_name }}',
                webDir: 'www',
                bundledWebRuntime: false
              };
              fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
            }

            const config = require('./capacitor.config.json');
            
            config.server = {
              url: '${{ github.event.inputs.web_url }}',
              cleartext: true,
              allowNavigation: ['*']
            };
            
            config.plugins = {
              SplashScreen: {
                launchShowDuration: 2000,
                backgroundColor: '#000000'
              }
            };
            
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "
          
      - name: Add iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios
          
      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath App.xcarchive archive
          
      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/App/App.xcarchive
